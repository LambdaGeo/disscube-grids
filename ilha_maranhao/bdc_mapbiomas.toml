# disscube-grids / ilha_maranhao — Brazil Data Cube + MapBiomas on one 300 m grid
#
# Ilha do Maranhão (São Luís, MA): Landsat spectral indices from the Brazil Data Cube (STAC), MapBiomas land
# use and PRODES, aggregated onto the same grid, which is snapped to the BDC Albers grid.
# Needs network and the `bdc` extra (pystac-client, fiona): pip install -r requirements.txt
#
# PRODES is here to show that a third source drops into the same file, but the island lies at the edge of the
# Legal Amazon domain: its maps have an artefact in the south-west (see the README), so they are not a
# land-cover reference for the island. The PRODES variables are prefixed with `prodes_`.
#
#     disscube validate bdc_mapbiomas.toml
#     disscube run bdc_mapbiomas.toml --workspace data/cube

schema = 1
name = "Ilha do Maranhão — BDC Landsat drivers and MapBiomas land use"

[grid]
name = "ilha_do_maranhao"
bbox = [-44.35, -2.62, -44.20, -2.47]      # WGS84; the grid itself is BDC Albers, snapped
resolution = 300

# ── Brazil Data Cube: Landsat 16-day composites, dry season 2020 ────────────
[[source]]
id = "ndvi"
type = "bdc"
collection = "LANDSAT-16D-1"
asset = "NDVI"
period = "2020-07-01/2020-09-30"
scale = 1e-4                               # BDC stores indices as int16 x 10 000

[[source]]
id = "mndwi"
type = "bdc"
collection = "LANDSAT-16D-1"
normalized_difference = ["green", "swir16"]
period = "2020-07-01/2020-09-30"

# ── MapBiomas land use (30 m), 2000 and 2020 ────────────────────────────────
[[source]]
id = "lulc_{year}"
type = "mapbiomas"
years = [2000, 2020]                       # one source per year: lulc_2000, lulc_2020
collection = 11
resolution = 30

# ── Derived variables ───────────────────────────────────────────────────────
[[derive]]
target = "ndvi_mean"
source = "ndvi"
operator = "mean"

[[derive]]
target = "mndwi_mean"
source = "mndwi"
operator = "mean"

[[derive]]
target = "landuse"
source = "lulc_{year}"                     # expanded over the source's years
operator = "majority"

[[derive]]
target = "urban_pct"
source = "lulc_{year}"
operator = "percentage"
class_code = 24                            # MapBiomas: urban area

[[derive]]
target = "forest_pct"
source = "lulc_{year}"
operator = "percentage"
class_code = 3                             # forest formation

[[derive]]
target = "mangrove_pct"
source = "lulc_{year}"
operator = "percentage"
class_code = 5                             # mangrove

# ── PRODES (Legal Amazon): edge of the domain, kept as a record of the test ─
[[source]]
id = "prodes_{year}"
type = "prodes"
years = [2008, 2016, 2024]

[[derive]]
target = "prodes_deforested_pct"
source = "prodes_{year}"
operator = "percentage"
class_code = 2                             # PRODES classes here: 1 forest, 2 deforested, 3 other

[[derive]]
target = "prodes_forest_pct"
source = "prodes_{year}"
operator = "percentage"
class_code = 1
