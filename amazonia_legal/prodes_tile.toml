# disscube-grids / amazonia_legal — PRODES on a 5.28 km grid, ONE 105.6 km tile (a template)
#
# DisSCube 0.5.0 reads the whole window of a source into memory. The PRODES raster of the Legal Amazon has
# 86,679 x 111,508 pixels (9.7 billion), so one TOML over the whole region does not fit in memory: build_prodes_amazonia.py
# writes this file once per tile (the bbox below is replaced), runs `disscube run` on each and joins the tiles.
# This file is also valid as it stands, for a quick test on a tile of the Arc of Deforestation:
#
#     disscube validate prodes_tile.toml
#     disscube run prodes_tile.toml --workspace data/tile --output data/tile.tif

schema = 1
name = "PRODES, one 105.6 km tile of the Legal Amazon"

[grid]
name = "tile"
crs = "EPSG:10857"                          # BDC Albers
resolution = 5280                           # 20 x 20 cells per tile
bbox = [5200000.0, 9900000.0, 5305600.0, 10005600.0]

[[source]]
id = "prodes_{year}"
type = "prodes"
years = [2008, 2024]                        # years are separable from 2007 on

[[derive]]
target = "prodes_deforested_pct"
source = "prodes_{year}"
operator = "percentage"
class_code = 2                              # PRODES classes here: 1 forest, 2 deforested, 3 other

[[derive]]
target = "prodes_forest_pct"
source = "prodes_{year}"
operator = "percentage"
class_code = 1
