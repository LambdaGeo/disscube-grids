# disscube-grids / para — Brazil Data Cube NDVI on the same grid as sources.toml
#
# NOT RUN. The BDC adapter of DisSCube 0.5.0 reads the whole window of every scene of the period into
# memory (float32) before it takes the median; over the whole state (about 48,000 × 46,000 pixels at 30 m)
# that is tens of gigabytes. Until the adapter reads by blocks, as the MapBiomas and PRODES ones now do,
# run it on a smaller `extent` (for example the bbox of one mesoregion), keeping the grid name and
# resolution, or use ../ilha_para/bdc_mapbiomas.toml, which ran with BDC data.
# Needs network and the `bdc` extra (pystac-client, fiona): pip install -r ../requirements.txt
#
#     disscube validate bdc_ndvi.toml
#     disscube run bdc_ndvi.toml --workspace data/bdc_ndvi --output data/bdc_ndvi.tif

schema = 1
name = "Pará — BDC Landsat NDVI, dry season 2020"

[grid]
name = "para"
bbox = [-58.90, -9.85, -46.06, 2.64]      # as in sources.toml; replace by a smaller box to try it
resolution = 5000

[[source]]
id = "ndvi"
type = "bdc"
collection = "LANDSAT-16D-1"
asset = "NDVI"
period = "2020-07-01/2020-09-30"
scale = 1e-4                               # BDC stores indices as int16 x 10 000

[[derive]]
target = "ndvi_mean"
source = "ndvi"
operator = "mean"
